name: tests

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (offline regression suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # For the CLI ↔ web contract test (imports travel_agent.py).
      - run: pip install requests python-dotenv
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  cli:
    name: CLI (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest
